<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkie</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{--bg:#1b1f23;--panel:#252b31;--ink:#e9e6dc;--dim:#8a929a;--tx:#ff5a36;--rx:#3fd6b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Arial Narrow",system-ui,sans-serif;display:flex;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom))}
main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
body:not(.live) main{justify-content:center;min-height:90vh}
h1{margin:0;font-size:28px}
.panel{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
input{font:inherit;font-size:18px;background:var(--bg);color:var(--ink);border:2px solid #3a424a;border-radius:10px;padding:10px;width:100%}
#room{font-size:28px;text-align:center;letter-spacing:.3em}
input:focus-visible,button:focus-visible{outline:3px solid var(--rx);outline-offset:2px}
.row{display:flex;gap:10px}
button{font:inherit;font-size:18px;border:0;border-radius:10px;padding:13px;cursor:pointer;background:#3a424a;color:var(--ink)}
.row button{flex:1}
button.go{background:var(--ink);color:var(--bg)}
#radio{display:none;gap:10px}
body.live #setup{display:none}
body.live #radio{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
#code{font-size:30px;letter-spacing:.2em}
#status{color:var(--dim);font-size:15px;text-align:right}
#map{height:36vh;min-height:210px;border-radius:12px;background:#10141a}
#chat{background:var(--bg);border-radius:10px;height:22vh;min-height:120px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:7px 11px;border-radius:12px;background:#3a424a;align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:var(--ink);color:var(--bg)}
.m small{display:block;color:var(--dim);font-size:12px}
.m.me small{color:#555}
.sys{align-self:center;color:var(--dim);font-size:13px}
#cf{display:flex;gap:8px}
#cf input{flex:1}
.leds{display:flex;gap:16px;color:var(--dim);font-size:14px}
.led{display:flex;align-items:center;gap:6px}
.led i{width:12px;height:12px;border-radius:50%;background:#3a424a}
#rxl.on i{background:var(--rx);box-shadow:0 0 10px var(--rx)}
#txl.on i{background:var(--tx);box-shadow:0 0 10px var(--tx)}
#ptt{height:76px;font-size:24px;border-radius:38px;border:4px solid #4b555e;touch-action:none;user-select:none;-webkit-user-select:none}
#ptt.down{background:var(--tx);border-color:#ffb09c;color:#fff}
</style>
</head>
<body>
<main>
  <h1>Walkie</h1>

  <section id="setup" class="panel">
    <input id="name" maxlength="16" placeholder="Your name" aria-label="Your name">
    <input id="room" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Channel code">
    <div class="row">
      <button class="go" id="join">Join channel</button>
      <button id="host">New channel</button>
    </div>
    <div id="status1" style="color:var(--dim);text-align:center">Enter a 4-digit code, or start a new channel and share its code.</div>
  </section>

  <section id="radio" class="panel">
    <div class="top"><div id="code">----</div><div id="status">Connecting…</div></div>
    <div id="map"></div>
    <div id="chat" aria-live="polite"></div>
    <form id="cf"><input id="msg" autocomplete="off" placeholder="Message" aria-label="Message"><button class="go" type="submit">Send</button></form>
    <div class="leds"><span class="led" id="rxl"><i></i>Receiving</span><span class="led" id="txl"><i></i>Sending</span></div>
    <button id="ptt">Hold to talk</button>
  </section>
  <audio id="audio" autoplay playsinline></audio>
</main>

<script>
const $=id=>document.getElementById(id);
let peer,local,track,ac,conn,map,myName='Guest',theirName='Them';
const me={m:null,line:null,pts:[]}, them={m:null,line:null,pts:[]};
let myPos=null,theirPos=null,fitted=false;

/* ---------- audio ---------- */
function beep(f,d=.07){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.08;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function say(t){$('status').textContent=t}
async function mic(){local=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});track=local.getAudioTracks()[0];track.enabled=false}
function watch(s){
  ac=ac||new AudioContext();const a=ac.createAnalyser();a.fftSize=256;ac.createMediaStreamSource(s).connect(a);
  const d=new Uint8Array(a.fftSize);
  (function loop(){a.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));$('rxl').classList.toggle('on',m>6);requestAnimationFrame(loop)})();
}
function bindCall(c){
  c.on('stream',s=>{$('audio').srcObject=s;$('audio').play().catch(()=>{});watch(s)});
  c.on('close',()=>say('Other side left'));
}

/* ---------- data: chat + location ---------- */
function send(o){if(conn&&conn.open)conn.send(o)}
function bindConn(c){
  conn=c;
  c.on('open',()=>{say('Connected');sys('Connected');send({t:'hi',name:myName});if(myPos)send({t:'loc',...myPos})});
  c.on('data',d=>{
    if(d.t==='hi'){theirName=d.name||'Them';sys(theirName+' joined')}
    else if(d.t==='chat')addMsg(d.text,theirName,false);
    else if(d.t==='loc'){theirPos=d;track_(them,d,'#ff5a36',theirName);updateDist()}
  });
  c.on('close',()=>{say('Other side left');sys(theirName+' left')});
}
function sys(t){const e=document.createElement('div');e.className='sys';e.textContent=t;$('chat').append(e);$('chat').scrollTop=1e9}
function addMsg(t,who,mine){
  const e=document.createElement('div');e.className='m'+(mine?' me':'');
  const s=document.createElement('small');s.textContent=who;e.append(s,document.createTextNode(t));
  $('chat').append(e);$('chat').scrollTop=1e9;
}
$('cf').onsubmit=e=>{e.preventDefault();const t=$('msg').value.trim();if(!t)return;send({t:'chat',text:t});addMsg(t,'You',true);$('msg').value=''};

/* ---------- map (Google Maps JS SDK) ---------- */
const GOOGLE_MAPS_KEY='AIzaSyDbryDRMguEw7CLKFpN3jr_WVsKlLQxtcU'; // <- paste your key here
const DARK=[{elementType:'geometry',stylers:[{color:'#1d2227'}]},{elementType:'labels.text.fill',stylers:[{color:'#8a929a'}]},{elementType:'labels.text.stroke',stylers:[{color:'#1b1f23'}]},{featureType:'road',elementType:'geometry',stylers:[{color:'#3a424a'}]},{featureType:'water',elementType:'geometry',stylers:[{color:'#10141a'}]},{featureType:'poi',stylers:[{visibility:'off'}]}];
function loadMaps(){
  return new Promise((res,rej)=>{
    if(window.google&&google.maps)return res();
    if(!GOOGLE_MAPS_KEY||GOOGLE_MAPS_KEY.startsWith('YOUR_'))return rej(new Error('no key'));
    window.__gm=()=>res();
    const s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+GOOGLE_MAPS_KEY+'&callback=__gm';
    s.onerror=()=>rej(new Error('load'));
    document.head.append(s);
  });
}
async function initMap(){
  try{await loadMaps()}catch(e){
    $('map').textContent=e.message==='no key'?'Add your Google Maps API key in index.html (GOOGLE_MAPS_KEY).':'Google Maps failed to load. Check the key and its allowed domains.';
    $('map').style.cssText+=';display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#8a929a';return}
  map=new google.maps.Map($('map'),{center:{lat:20,lng:78},zoom:4,styles:DARK,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy'});
  if(myPos)track_(me,myPos,'#e9e6dc','You');
  if(theirPos)track_(them,theirPos,'#ff5a36',theirName);
}
function track_(u,p,color,label){
  if(!map)return;
  const ll={lat:p.lat,lng:p.lng};
  if(!u.m){
    u.m=new google.maps.Marker({map,position:ll,label:{text:label,color:'#fff',fontSize:'12px',className:'mk'},title:label,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:2,labelOrigin:new google.maps.Point(0,-2.2)}});
    u.line=new google.maps.Polyline({map,path:[],strokeColor:color,strokeOpacity:.8,strokeWeight:4});
  }
  u.m.setPosition(ll);u.m.setLabel({text:label,color:'#fff',fontSize:'12px'});
  u.pts.push(ll);u.line.setPath(u.pts);
  fit();
}
function fit(){
  if(!map)return;
  const pts=[myPos,theirPos].filter(Boolean);
  if(!pts.length)return;
  if(pts.length===2){const b=new google.maps.LatLngBounds();pts.forEach(q=>b.extend(q));map.fitBounds(b,50);if(map.getZoom()>17)map.setZoom(17)}
  else if(!fitted){map.setCenter(pts[0]);map.setZoom(16);fitted=true}
}
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function updateDist(){if(myPos&&theirPos){const d=km(myPos,theirPos);say(theirName+' is '+(d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km')+' away')}}
function startGPS(){
  if(!navigator.geolocation){sys('Location not supported');return}
  navigator.geolocation.watchPosition(p=>{
    myPos={lat:p.coords.latitude,lng:p.coords.longitude};
    track_(me,myPos,'#e9e6dc','You');send({t:'loc',...myPos});updateDist();
  },()=>sys('Location blocked. Allow it to appear on the map.'),{enableHighAccuracy:true,maximumAge:2000});
}

/* ---------- connect ---------- */
async function start(isHost){
  const code=isHost?String(Math.floor(1000+Math.random()*9000)):$('room').value.trim();
  if(!/^\d{4}$/.test(code)){$('status1').textContent='Code must be 4 digits.';return}
  myName=$('name').value.trim()||'Guest';
  try{await mic()}catch(e){$('status1').textContent='Microphone blocked. Allow mic access and try again.';return}
  document.body.classList.add('live');$('code').textContent=code;
  initMap();startGPS();
  const id='walkie-'+code;
  if(isHost){
    peer=new Peer(id);
    peer.on('open',()=>{say('Share the code and wait…');sys('Channel '+code+' open')});
    peer.on('call',c=>{c.answer(local);bindCall(c)});
    peer.on('connection',bindConn);
    peer.on('error',e=>say(e.type==='unavailable-id'?'Code in use. Reload.':'Error: '+e.type));
  }else{
    peer=new Peer();
    peer.on('open',()=>{say('Calling…');bindCall(peer.call(id,local));bindConn(peer.connect(id,{reliable:true}))});
    peer.on('error',e=>say(e.type==='peer-unavailable'?'No channel with that code.':'Error: '+e.type));
  }
}

/* ---------- push to talk ---------- */
function talk(on){
  if(!track||track.enabled===on)return;
  track.enabled=on;$('ptt').classList.toggle('down',on);$('txl').classList.toggle('on',on);
  $('ptt').textContent=on?'Talking…':'Hold to talk';beep(on?880:520);
}
const p=$('ptt');
p.addEventListener('pointerdown',e=>{p.setPointerCapture(e.pointerId);talk(true)});
['pointerup','pointercancel'].forEach(t=>p.addEventListener(t,()=>talk(false)));
p.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'&&document.body.classList.contains('live')&&document.activeElement.tagName!=='INPUT'&&!e.repeat){e.preventDefault();talk(true)}});
addEventListener('keyup',e=>{if(e.code==='Space')talk(false)});

$('host').onclick=()=>start(true);
$('join').onclick=()=>start(false);
</script>
</body>
</html>
